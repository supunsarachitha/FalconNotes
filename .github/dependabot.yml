# Dependabot opens no version update pull requests here: updates come from the maintenance routine, which audits the
# dependencies by hand. `open-pull-requests-limit: 0` is what switches them off.
#
# The entry is kept for security pull requests, which are a repository setting and stay on: it keeps them out of
# reference/, the read-only Maple Notes reference, which is never updated.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    exclude-paths:
      - "reference/**"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
