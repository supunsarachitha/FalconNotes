# Dependabot opens the routine update pull requests and CI tests them. Each month, patch and minor updates arrive as
# one grouped pull request per ecosystem and a major update as its own pull request; a security fix arrives as soon
# as an advisory is published. Nothing merges by itself.
#
# These pull requests change versions only. THIRD-PARTY-NOTICES.md and CHANGELOG.md are updated on the release branch
# that gathers them. reference/ is the read-only Maple Notes reference and is never updated.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    exclude-paths:
      - "reference/**"
    schedule:
      interval: monthly
    groups:
      nuget-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
